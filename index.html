<style>
/* Follows the M&A Monitor integrated-site prototype: Inter + JetBrains Mono, glass cards, light only */
:root{
  --bg:#F5F7FB; --t:#0F1729; --t2:#4A5568; --t3:#6B7A93;
  --b:rgba(0,0,0,.07); --b2:rgba(0,0,0,.045);
  --a:#4F6EF7; --al:rgba(79,110,247,.08); --ah:#3B5AE0;
  --g:#0D9B6A; --gb:rgba(13,155,106,.09);
  --am:#B07D00; --ab:rgba(176,125,0,.09);
  --r:#DC3E1B; --rb:rgba(220,62,27,.08);
  --p:#7C5CFC; --pb:rgba(124,92,252,.08);
  --ss:0 1px 3px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.03);
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.86);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pad:32px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45;
  background-image:linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.02) 1px,transparent 1px),radial-gradient(60% 50% at 0% 0%,rgba(79,110,247,.09),transparent 65%),radial-gradient(50% 45% at 100% 100%,rgba(124,92,252,.06),transparent 65%);
  background-size:80px 80px,80px 80px,100% 100%,100% 100%;background-attachment:fixed;min-height:100vh}
a{color:var(--a);text-decoration:none}
a:hover{color:var(--ah)}
button,input{font:inherit}
.hdr{background:rgba(255,255,255,.76);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-bottom:1px solid var(--b);padding-inline:var(--pad);min-height:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:9px;color:var(--t)}
.brand img{height:24px;width:auto;display:block}
.logo-t{font-weight:700;font-size:15px;letter-spacing:-.3px;color:var(--t);white-space:nowrap}
.logo-t span{color:var(--t3);font-weight:400}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav a{color:var(--t2);font-size:13px;font-weight:500;padding:7px 11px;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav a:hover{background:rgba(0,0,0,.035);color:var(--t)}
.nav a.on{color:var(--a);background:var(--al);box-shadow:inset 0 0 0 1px rgba(79,110,247,.14)}
.nav .live{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 6px rgba(13,155,106,.6)}
.who{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--t3)}
.who b{color:var(--t2);font-weight:500}
.who a{font-weight:600;font-size:12px}
.wrap{max-width:1380px;margin:0 auto;padding-inline:var(--pad);padding-block:26px 40px;display:flex;flex-direction:column;gap:18px}
.phd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.phd h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;background:linear-gradient(135deg,#0F1729 35%,#4F6EF7 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#0F1729}
.phd p{margin:6px 0 0;color:var(--t2);font-size:13.5px;line-height:1.5;max-width:70ch}
.phd p b{color:var(--t);font-family:var(--mono);font-weight:500}
.daynav{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.daynav a,.daynav span.dis{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;border:1px solid var(--b);background:var(--glass);font-size:12px;font-weight:600}
.daynav span.dis{color:var(--t3);opacity:.55}
.daynav .latest{font-size:11px;font-weight:700;color:var(--g);background:var(--gb);border:1px solid rgba(13,155,106,.14);padding:3px 8px;border-radius:5px}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.kpi{text-align:center;padding:10px 14px;background:var(--glass);border:1px solid var(--b);border-radius:10px;min-width:96px;backdrop-filter:blur(12px)}
.kv{display:block;font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--t)}
.kv.r{color:var(--r)} .kv.am{color:var(--am)} .kv.p{color:var(--p)}
.kl{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-top:2px}
.note{margin:0;padding:9px 14px;background:var(--ab);border:1px solid rgba(176,125,0,.14);border-radius:9px;color:var(--t2);font-size:12px}
.note b{color:var(--am)}
.note.ok{background:var(--gb);border-color:rgba(13,155,106,.16)} .note.ok b{color:var(--g)}
.note.err{background:var(--rb);border-color:rgba(220,62,27,.16)} .note.err b{color:var(--r)}
.card{background:var(--glass2);border:1px solid var(--b);border-radius:12px;box-shadow:var(--ss);backdrop-filter:blur(14px);overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--b);background:rgba(0,0,0,.016);flex-wrap:wrap}
.card-t{font-size:12.5px;font-weight:700;letter-spacing:-.15px;display:flex;align-items:center;gap:8px;margin:0}
.card-s{font-size:10.5px;color:var(--t3);font-weight:500}
.tscr{overflow-x:auto}
.tfr{padding:10px 16px;background:rgba(0,0,0,.016);border-top:1px solid var(--b);font-size:11.5px;color:var(--t3);line-height:1.5}
.tfr b{color:var(--t2);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{background:rgba(0,0,0,.018);padding:10px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);border-bottom:1px solid var(--b);white-space:normal;vertical-align:bottom}
tbody td{padding:9px 10px;font-size:12.5px;color:var(--t2);border-bottom:1px solid var(--b2);vertical-align:middle;white-space:nowrap}
thead th:first-child,tbody td:first-child{padding-left:16px}
thead th:last-child,tbody td:last-child{padding-right:16px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(79,110,247,.035)}
td.fn{font-weight:600;color:var(--t);white-space:normal;min-width:170px;max-width:280px;line-height:1.3}
td.co{white-space:normal;min-width:140px;max-width:240px;line-height:1.3}
.r{text-align:right} th.r{text-align:right}
.m{font-family:var(--mono);font-size:11.5px;color:var(--t)}
.m b{font-weight:700}
.strong{font-weight:700}
.neg,.pos{color:var(--r);font-weight:700} .zero,.na,.dash{color:var(--t3)}
.stat{display:inline-flex;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.stat.late{background:var(--ab);color:var(--am);border-color:rgba(176,125,0,.14)}
.stat.ok{background:var(--gb);color:var(--g);border-color:rgba(13,155,106,.14)}
.stat.disc{background:var(--rb);color:var(--r);border-color:rgba(220,62,27,.14)}
.stat.opd{background:var(--pb);color:var(--p);border-color:rgba(124,92,252,.14)}
.stat.off{background:rgba(0,0,0,.05);color:var(--t3);border-color:var(--b)}
.tg{display:inline-flex;padding:2px 6px;border-radius:4px;font:700 9px/1.3 var(--mono);letter-spacing:.03em;white-space:nowrap;background:var(--ab);color:var(--am);margin-left:6px;vertical-align:1px}
.tg.ie{background:var(--gb);color:var(--g)}
.cnt{font:700 9px/1.3 var(--mono);padding:2px 6px;border-radius:4px;background:var(--a);color:#fff}
.lateby.days{color:var(--r);font-weight:700} .lateby.mins{color:var(--am);font-weight:700}
details.card summary{cursor:pointer;list-style-position:inside;padding:12px 16px;font-size:12.5px;font-weight:700;color:var(--a);background:rgba(0,0,0,.016)}
details.card[open] summary{border-bottom:1px solid var(--b)}
summary:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
.empty{margin:0;padding:16px;color:var(--g);font-weight:600}
.muted{margin:0;padding:16px;color:var(--t3)}
td.nt{white-space:normal;min-width:110px;max-width:300px;font-size:11.5px;color:var(--t3);line-height:1.35}
.pc{color:var(--t3);font-size:10.5px;margin-left:4px}
.hl{font-size:10.5px;font-weight:600;white-space:nowrap}
.hl:hover{text-decoration:underline}
.hd2{line-height:1.6}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--b);padding-top:14px;font-size:11.5px;color:var(--t3)}
.filter{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--b)}
.filter input{flex:1;max-width:360px}
/* forms */
.inp{width:100%;padding:9px 11px;border:1px solid rgba(0,0,0,.12);border-radius:8px;background:#fff;color:var(--t);font-size:13px}
.inp:focus{outline:2px solid var(--a);outline-offset:0;border-color:transparent}
label.f{display:block;font-size:11px;font-weight:600;color:var(--t2);margin:0 0 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid transparent;background:var(--a);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ah)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--t);border-color:rgba(0,0,0,.12)}
.btn.sec:hover{background:#F0F3FA}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn.danger{background:#fff;color:var(--r);border-color:rgba(220,62,27,.3)}
.btn.danger.arm{background:var(--r);color:#fff}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:400px;background:var(--glass2);border:1px solid var(--b);border-radius:16px;box-shadow:0 10px 40px rgba(15,23,41,.08),var(--ss);backdrop-filter:blur(14px);padding:30px 28px}
.auth-card .lg{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth-card .lg img{height:40px}
.auth-card h1{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.auth-card p.sub{margin:0 0 20px;color:var(--t2);font-size:13px}
.auth-card form{display:flex;flex-direction:column;gap:14px}
.auth-card .btn{width:100%;padding:11px}
.auth-card .fine{margin:18px 0 0;font-size:11.5px;color:var(--t3);line-height:1.5}
.msg{margin:0;font-size:12px;padding:8px 11px;border-radius:8px}
.msg.err{background:var(--rb);color:var(--r)}
.msg.ok{background:var(--gb);color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px}
.pw{display:flex;gap:6px}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t2)}
.creds{margin:0;padding:12px 14px;border-radius:10px;background:var(--gb);border:1px solid rgba(13,155,106,.16);font-size:12.5px;color:var(--t2)}
.creds pre{margin:8px 0;font-family:var(--mono);font-size:12px;color:var(--t);white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.loading{padding:60px 0;text-align:center;color:var(--t3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1024px){:root{--pad:20px}}
@media (max-width:640px){:root{--pad:16px}.phd h1{font-size:23px}.kpi{flex:1 1 40%}.nav{order:3;flex-basis:100%;overflow-x:auto}.who{margin-left:auto}}
</style>

  auth: { persistSession: true, autoRefreshToken: true, storageKey: "r83-exceptions-auth" }

// ---- helpers --------------------------------------------------------------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const two = n => String(n).padStart(2, "0");
const fd = s => { if (!s) return "–"; const d = pd(s); return `${two(d.getUTCDate())} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const fds = s => { if (!s) return "–"; const d = pd(s); return `${DOW[d.getUTCDay()]} ${two(d.getUTCDate())} ${MON[d.getUTCMonth()]}`; };
const fdl = s => { const d = pd(s); return `${DOW[d.getUTCDay()]} ${fd(s)}`; };
const london = ts => ts ? new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(new Date(ts)) : "–";
const t8 = t => String(t || "").slice(0, 8);
const num = n => Math.abs(n).toLocaleString("en-GB", { maximumFractionDigits: 0 });
const ZERO = '<span class="zero">0</span>', DASH = '<span class="dash">–</span>';
function fn(x) {
  if (x === null || x === undefined) return '<span class="na">n/a</span>';
  if (Number(x) === 0) return ZERO;
  return `<span class="${x < 0 ? "neg" : "pos"}">${x < 0 ? "−" : "+"}${num(x)}</span>`;
}
const netHold = r => (Number(r.long_total) || 0) - (Number(r.short_total) || 0);
const netPc = r => (Number(r.long_pc) || 0) - (Number(r.short_pc) || 0);
function netCell(r) {
  const n = netHold(r);
  if (!n) return ZERO;
  return `${n < 0 ? "−" : ""}${num(n)} <span class="pc">${netPc(r).toFixed(2)}%</span>`;
}
function discPc(r) {
  const base = Math.abs(netHold(r)), d = Math.abs(Number(r.net_disc) || 0);
  return base && d ? `${(d / base * 100).toFixed(3)}%` : "–";
}
const plus10 = s => encodeURIComponent(String(s || "").slice(0, 10)).replace(/%20/g, "+");
const historyUrl = r => `${TRACKER}/rns.totals.php?clean=1&target=${plus10(r.target)}&bidder=${plus10(r.filer)}`;
const filingUrl = r => r.rns_id ? `${TRACKER}/rnsdata.view.php?id=${encodeURIComponent(r.rns_id)}&back_to=totals` : null;
function links(r) {
  const f = filingUrl(r);
  return (f ? `<a class="hl" href="${esc(f)}" target="_blank" rel="noopener" title="Open this filing on the 8.3 Tracker (login required)">This filing&nbsp;&#8599;</a> &nbsp;` : "") +
    `<a class="hl" href="${esc(historyUrl(r))}" target="_blank" rel="noopener" title="Open this filer’s trading record on the 8.3 Tracker (login required)">${f ? "All filings" : "Filings"}&nbsp;&#8599;</a>`;
}
const P_LATE = '<span class="stat late">Late</span>', P_OK = '<span class="stat ok">On time</span>';
const P_YES = '<span class="stat disc">Yes</span>', P_OPD = '<span class="stat opd">Opening position</span>';
function panelTag(r) {
  if (r.on_table === false) return ' <span class="tg" title="Not on the UK or Irish Takeover Panel disclosure table">not on a disclosure table</span>';
  if (r.panel === "IE") return ' <span class="tg ie" title="Offer period listed on the Irish Takeover Panel disclosure table; Irish business days used">Irish Panel</span>';
  return "";
}
const cap = s => { s = String(s || ""); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : ""; };
const rep = r => `${fds(r.rep_date)} · ${t8(r.rep_time)}`;
function friendlyError(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "Email or password not recognised.";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Could not reach the server. Check your connection and try again.";
  return m;
}
function genPassword() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  const a = new Uint32Array(14); crypto.getRandomValues(a);
  const s = Array.from(a, x => chars[x % chars.length]).join("");
  return `${s.slice(0, 4)}-${s.slice(4, 9)}-${s.slice(9)}`;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = o, 1500); } }
  catch (_) { prompt("Copy:", text); }
}

// ---- auth screens -----------------------------------------------------------
function authShell(title, sub, inner, fine = "") {
  app.innerHTML = `<main class="auth"><section class="auth-card" aria-labelledby="ah">
    <div class="lg"><img src="${ICON}" alt=""><span class="logo-t">M&amp;A Monitor <span>/ 8.3 Tracker</span></span></div>
    <h1 id="ah">${title}</h1><p class="sub">${sub}</p>${inner}${fine ? `<p class="fine">${fine}</p>` : ""}</section></main>`;
}
function showLogin(msg) {
  authShell("Filing exceptions", "Rule 8.3 disclosures with a net discrepancy or filed late, updated at 17:00 each business day.",
    `<form id="lf" novalidate>
      ${msg ? `<p class="msg err" role="alert">${esc(msg)}</p>` : ""}
      <div><label class="f" for="em">Email</label><input class="inp" id="em" type="email" autocomplete="username" required></div>
      <div><label class="f" for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Sign in</button>
    </form>`,
    `Access is for M&amp;A Monitor subscribers. Forgotten your password or need access? Email <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a>.`);
  const f = document.getElementById("lf");
  document.getElementById("em").focus();
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: f.em.value.trim(), password: f.pw.value });
    if (error) { showLogin(friendlyError(error)); return; }
    await boot();
  });
}
function showSetPassword(first) {
  authShell(first ? "Choose your password" : "Change password",
    first ? "Welcome. Please replace the temporary password you were given with one of your own." : `Signed in as ${esc(S.session.user.email)}.`,
    `<form id="pf" novalidate>
      <p class="msg err" id="pmsg" role="alert" hidden></p>
      <div><label class="f" for="p1">New password (at least 10 characters)</label><input class="inp" id="p1" type="password" autocomplete="new-password" minlength="10" required></div>
      <div><label class="f" for="p2">Repeat new password</label><input class="inp" id="p2" type="password" autocomplete="new-password" minlength="10" required></div>
      <button class="btn" type="submit">Save password</button>
      ${first ? "" : `<a href="#/" style="text-align:center;font-size:12px">Cancel</a>`}
    </form>`,
    first ? `<a href="#" id="so">Sign out</a>` : "");
  const f = document.getElementById("pf"), m = document.getElementById("pmsg");
  document.getElementById("p1").focus();
  const so = document.getElementById("so"); if (so) so.onclick = e => { e.preventDefault(); signOut(); };
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const p1 = f.p1.value, p2 = f.p2.value;
    const fail = t => { m.textContent = t; m.hidden = false; };
    if (p1.length < 10) return fail("Use at least 10 characters.");
    if (p1 !== p2) return fail("The two passwords don’t match.");
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Saving…";
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { btn.disabled = false; btn.textContent = "Save password"; return fail(friendlyError(error)); }
    await sb.rpc("password_changed");
    S.me.must_change_password = false;
    location.hash = "#/"; route();
  });
}
function showNoAccess() {
  authShell("No access", `You’re signed in as <b>${esc(S.session.user.email)}</b>, but this account doesn’t have access to the filing exceptions.`,
    `<button class="btn sec" id="so" type="button">Sign out</button>`,
    `If you think this is a mistake, email <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a>.`);
  document.getElementById("so").onclick = signOut;
}
async function signOut() { await sb.auth.signOut(); S.me = null; S.days = null; S.dayCache = {}; location.hash = ""; showLogin(); }

      <div class="who"><b>${esc(S.session.user.email)}</b><a href="#/password">Password</a><a href="#" id="so">Sign out</a></div>
    </header>
    <main class="wrap">${body}
    <footer><span>&copy; ${new Date().getFullYear()} M&amp;A Monitor Limited &middot; Confidential: for subscribers only</span><span>${right}</span></footer></main>`;
  document.getElementById("so").onclick = e => { e.preventDefault(); signOut(); };
}

async function loadDays(force) {
  if (S.days && !force) return S.days;
  const { data, error } = await sb.from("report_days")
    .select("report_date, export_taken, uploaded_at, filings_checked, n_disc, n_late, n_opd, n_excluded, disc_checked")
    .order("report_date", { ascending: false });
  if (error) throw error;
  return (S.days = data || []);
}
async function loadDay(d) {
  if (S.dayCache[d]) return S.dayCache[d];
  const { data, error } = await sb.from("report_days").select("*").eq("report_date", d).maybeSingle();
  if (error) throw error;
  return (S.dayCache[d] = data);
}

// ---- tables (same layout as the mock-up) -----------------------------------
const card = (title, n, sub, body, foot) =>
  `<section class="card"><div class="card-hd"><h2 class="card-t">${title} <span class="cnt">${n}</span></h2><span class="card-s">${sub}</span></div>${body}<div class="tfr">${foot}</div></section>`;
const table = (head, rows) => `<div class="tscr"><table><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
const who = r => `<td class="fn">${esc(r.filer)}<br>${links(r)}</td>`;

function discTable(rows) {
  return table(`<th>Filer</th><th>Company dealt in</th><th>Dealing date</th><th>Reported</th><th class="r">Total net holding</th><th class="r">Net discrepancy</th><th class="r">Discrepancy as % of net holding</th>`,
    rows.map(r => `<tr>${who(r)}<td class="co">${esc(r.target)}</td><td class="m">${fd(r.dealt)}</td>
      <td class="m hd2">${rep(r)}<br>${r.late ? P_LATE : P_OK}</td><td class="r m">${netCell(r)}</td>
      <td class="r m strong">${fn(r.net_disc)}</td><td class="r m">${discPc(r)}</td></tr>`));
}
function lateTable(rows) {
  return table(`<th>Filer</th><th>Company dealt in</th><th>Dealing date</th><th>Deadline</th><th>Reported</th><th class="r">Late by</th><th>Discrepancy</th><th>M&amp;A notes</th>`,
    rows.map(r => `<tr>${who(r)}<td class="co">${esc(r.target)}${panelTag(r)}</td><td class="m">${fd(r.dealt)}</td>
      <td class="m">${fds(r.deadline)} · 15:30</td><td class="m">${fds(r.rep_date)} · <b>${t8(r.rep_time)}</b></td>
      <td class="r m"><span class="lateby ${(r.late_sort || 0) >= 10000 ? "days" : "mins"}">${esc(r.late_by)}</span></td>
      <td>${r.disc ? P_YES : DASH}</td><td class="nt">${esc(cap(r.note)) || DASH}</td></tr>`));
}
function opdTable(rows) {
  return table(`<th>Filer</th><th>Company dealt in</th><th>Position / dealing date</th><th>Offer period commenced</th><th>Opening position deadline</th><th>Reported</th><th>M&amp;A notes</th><th class="r">If it has a dealing</th>`,
    rows.map(r => {
      const st = r.op_start ? (r.op_has_time ? `${two(pd(r.op_start).getUTCDate())} ${MON[pd(r.op_start).getUTCMonth()]} · ${String(r.op_start).slice(11, 16)}` : fd(r.op_start)) : "–";
      return `<tr>${who(r)}<td class="co">${esc(r.target)}${panelTag(r)}</td><td class="m">${fd(r.dealt)}</td><td class="m">${st}</td>
        <td class="m">${fds(r.opd_deadline)} · 15:30</td><td class="m">${rep(r)}</td><td>${r.opd_noted ? P_OPD : DASH}</td>
        <td class="r m"><span class="lateby mins">${esc(r.late_by)} late</span></td></tr>`;
    }));
}
function exclTable(rows) {
  return table(`<th>Filer</th><th>Company dealt in</th><th>Dealing date</th><th>Reported</th><th>Reason</th><th>M&amp;A notes</th>`,
    rows.map(r => `<tr>${who(r)}<td class="co">${esc(r.target)}</td><td class="m">${fd(r.dealt)}</td><td class="m">${rep(r)}</td>
      <td><span class="stat ok">${esc(r.excluded)}</span></td><td class="nt">${esc(cap(r.note))}</td></tr>`));
}
function allRows(rows) {
  return rows.map(r => {
    const flags = (r.disc ? '<span class="stat disc">Discrepancy</span> ' : "") + (r.late ? P_LATE : "") + (r.opd ? '<span class="stat opd">Opening window</span>' : "");
    return `<tr data-q="${esc((r.filer + " " + r.target).toLowerCase())}">${who(r)}<td class="co">${esc(r.target)}</td><td class="m">${fd(r.dealt)}</td>
      <td class="m">${rep(r)}</td><td class="r m">${fn(r.net_disc)}</td><td>${flags || DASH}</td></tr>`;
  });
}

// ---- pages ------------------------------------------------------------------
async function pageDay(date) {
  const days = await loadDays();
  if (!days.length) {
    shell("day", `<div class="phd"><div><h1>Filing exceptions</h1><p>No days have been published yet. The first update arrives at 17:00 on the next business day.</p></div></div>`);
    return;
  }
  const d = date && days.find(x => x.report_date === date) ? date : days[0].report_date;
  const i = days.findIndex(x => x.report_date === d);
  const day = await loadDay(d);
  const rows = (day && day.filings) || [];
  const disc = rows.filter(r => r.disc).sort((a, b) => Math.abs(b.net_disc || 0) - Math.abs(a.net_disc || 0));
  const late = rows.filter(r => r.late).sort((a, b) => (b.late_sort || 0) - (a.late_sort || 0));
  const opd = rows.filter(r => r.opd).sort((a, b) => String(a.opd_deadline).localeCompare(String(b.opd_deadline)));
  const excl = rows.filter(r => r.excluded && r.would_be_late);
  const prev = days[i + 1], next = days[i - 1];
  const discOk = day.disc_checked !== false;
  const dn = `<div class="daynav">
      ${prev ? `<a href="#/day/${prev.report_date}">&larr; ${fds(prev.report_date)}</a>` : `<span class="dis">&larr; Earlier</span>`}
      ${next ? `<a href="#/day/${next.report_date}">${fds(next.report_date)} &rarr;</a>` : `<span class="dis">Later &rarr;</span>`}
      ${i === 0 ? `<span class="latest">Latest</span>` : `<a href="#/">Latest</a>`}
      <a href="#/archive">All days</a></div>`;
  const warn = (day.table_loaded === false ? `<p class="note"><b>Note.</b> The Takeover Panel disclosure tables could not be read for this day, so the opening-position allowance has not been applied.</p>` : "") +
    (day.notes_present === false ? `<p class="note"><b>Note.</b> M&amp;A notes were missing from this day’s data, so amendments and positions calculated by M&amp;A Monitor could not be left out of the timing check.</p>` : "");
  shell("day", `
    <div class="phd">
      <div><h1>Filing exceptions</h1>
      <p>Rule 8.3 disclosures announced <b>${fdl(d)}</b> with a net discrepancy, or filed after the 15:30 deadline.</p>${dn}</div>
      <div class="kpis">
        <div class="kpi"><span class="kv">${rows.length}</span><span class="kl">Filings checked</span></div>
        <div class="kpi"><span class="kv r">${discOk ? disc.length : "–"}</span><span class="kl">Net discrepancy</span></div>
        <div class="kpi"><span class="kv am">${late.length}</span><span class="kl">Late</span></div>
        <div class="kpi"><span class="kv p">${opd.length}</span><span class="kl">Opening window</span></div>
      </div>
    </div>${warn}
    ${card("Filings with a net discrepancy", discOk ? disc.length : "–", "Largest first", !discOk ? '<p class="muted">Not available for this day. Discrepancies are worked out by comparing each filing with the filer’s previous filing, and the filings before this day were not loaded.</p>' : disc.length ? discTable(disc) : '<p class="empty">No discrepancies on this day.</p>',
      "Flagged when the total net discrepancy is not zero. Total net holding is the filer’s disclosed total long position minus its total short position (number of securities and % of the class); the last column is the net discrepancy divided by that holding. Under each filer, <b>This filing &#8599;</b> opens the disclosure itself and <b>All filings &#8599;</b> the filer’s full trading record on the 8.3 Tracker (login required).")}
    ${card("Late filings", late.length, "Latest first", late.length ? lateTable(late) : '<p class="empty">No late filings on this day.</p>',
      "Deadline is <b>15:30 on the business day after the dealing date</b> (UK bank holidays skipped; Irish holidays for Irish Panel companies). A filing stamped 15:31:00 or later, or on a later day, is late. Amendments and positions calculated by M&amp;A Monitor are left out.")}
    ${card("Within the opening-position window", opd.length, "UK and Irish Takeover Panel disclosure tables", opd.length ? opdTable(opd) : '<p class="empty">None on this day.</p>',
      "These missed the next-business-day deadline, but the offer period began less than 10 business days before the filing, so an Opening Position Disclosure was still in time (Rule 8.3(a): <b>15:30 on the 10th business day</b> after the offer period commenced; the Irish Takeover Rules set the same deadline for Irish Panel companies, counted in Irish business days). Late only if the filing includes a dealing.")}
    <details class="card"><summary>${excl.length} filing${excl.length === 1 ? "" : "s"} left out of the timing check (amendments and positions calculated by M&amp;A Monitor)</summary>
      ${excl.length ? exclTable(excl) : '<p class="muted">None on this day.</p>'}</details>
    <details class="card" id="allc"><summary>All ${rows.length} filings checked</summary>
      <div class="filter"><label class="sr" for="q">Filter filings</label><input class="inp" id="q" type="search" placeholder="Filter by filer or company…"><span class="card-s" id="qn"></span></div>
      ${table(`<th>Filer</th><th>Company dealt in</th><th>Dealing date</th><th>Reported</th><th class="r">Net discrepancy</th><th>Flags</th>`, allRows(rows))}
    </details>`,
    `Data uploaded ${london(day.uploaded_at)} &middot; updates 17:00 each business day`);
  const q = document.getElementById("q"), qn = document.getElementById("qn");
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll("#allc tbody tr").forEach(tr => { const hit = !v || tr.dataset.q.includes(v); tr.hidden = !hit; n += hit; });
    qn.textContent = v ? `${n} shown` : "";
  });
  if (!S.logged.has(d)) { S.logged.add(d); sb.rpc("log_view", { p_date: d }).then(() => {}, () => {}); }
}

async function pageArchive() {
  const days = await loadDays(true);
  const rows = days.map(x => `<tr><td class="m"><a href="#/day/${x.report_date}"><b>${fdl(x.report_date)}</b></a></td>
      <td class="r m">${x.filings_checked}</td><td class="r m">${x.disc_checked === false ? DASH : x.n_disc ? `<span class="neg">${x.n_disc}</span>` : ZERO}</td>
      <td class="r m">${x.n_late ? `<b style="color:var(--am)">${x.n_late}</b>` : ZERO}</td><td class="r m">${x.n_opd ? `<b style="color:var(--p)">${x.n_opd}</b>` : ZERO}</td>
      <td class="r m">${x.n_excluded || ZERO}</td></tr>`);
  const tot = k => days.reduce((s, x) => s + (x[k] || 0), 0);
  shell("archive", `<div class="phd"><div><h1>Archive</h1><p>Every business day published so far. Open a day to see its discrepancies, late filings and opening-position cases.</p></div>
      <div class="kpis"><div class="kpi"><span class="kv">${days.length}</span><span class="kl">Days</span></div>
      <div class="kpi"><span class="kv r">${tot("n_disc")}</span><span class="kl">Discrepancies</span></div>
      <div class="kpi"><span class="kv am">${tot("n_late")}</span><span class="kl">Late filings</span></div></div></div>
    <section class="card"><div class="card-hd"><h2 class="card-t">Published days <span class="cnt">${days.length}</span></h2><span class="card-s">Newest first</span></div>
      ${days.length ? table(`<th>Announcement date</th><th class="r">Filings checked</th><th class="r">Net discrepancy</th><th class="r">Late</th><th class="r">Opening window</th><th class="r">Left out</th>`, rows) : '<p class="muted">Nothing published yet.</p>'}
    </section>`, "updates 17:00 each business day");
}

// ---- clients (admin) ----------------------------------------------------------
async function adminCall(body) {
  const { data, error } = await sb.functions.invoke("admin-users", { body });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (_) {}
    throw new Error(m);
  }
  return data;
}
function credsBox(email, pw, isNew) {
  const text = `Site: ${location.origin}${location.pathname}\nEmail: ${email}\nTemporary password: ${pw}\n\nYou will be asked to choose your own password when you first sign in.`;
  return `<div class="creds" role="status"><b>${isNew ? "Login created." : "Password reset."}</b> Send these details to the client (they won’t be shown again):
    <pre>${esc(text)}</pre><button class="btn sm sec" type="button" data-copy="${esc(text)}">Copy details</button></div>`;
}
async function pageClients(flash) {
  if (!S.me.is_admin) { location.hash = "#/"; return; }
  const { data, error } = await sb.rpc("admin_list_clients");
  if (error) throw error;
  const list = data || [];
  const rows = list.map(c => `<tr data-email="${esc(c.email)}">
      <td class="fn">${esc(c.name || "–")}<br><span class="hl" style="font-weight:500;color:var(--t3)">${esc(c.email)}</span></td>
      <td class="co">${esc(c.company || "–")}</td>
      <td>${c.active ? '<span class="stat ok">Active</span>' : '<span class="stat off">Suspended</span>'} ${c.is_admin ? '<span class="stat opd">Admin</span>' : ""} ${c.must_change_password ? '<span class="stat late" title="Has not yet replaced the temporary password">Temp password</span>' : ""}</td>
      <td class="m">${london(c.last_sign_in_at)}</td><td class="m">${london(c.last_viewed_at)}</td><td class="r m">${c.views_30d}</td>
      <td><div class="acts">
        <button class="btn sm sec" data-act="reset">Reset password</button>
        ${c.email === S.me.email ? "" : `<button class="btn sm sec" data-act="${c.active ? "suspend" : "activate"}">${c.active ? "Suspend" : "Reactivate"}</button>
        <button class="btn sm sec" data-act="${c.is_admin ? "unadmin" : "admin"}">${c.is_admin ? "Remove admin" : "Make admin"}</button>
        <button class="btn sm danger" data-act="remove">Remove</button>`}
      </div></td></tr>`);
  shell("clients", `<div class="phd"><div><h1>Clients</h1><p>Who can sign in to the filing exceptions site. Suspending someone blocks the data straight away; removing deletes their login.</p></div>
      <div class="kpis"><div class="kpi"><span class="kv">${list.filter(c => c.active).length}</span><span class="kl">Active logins</span></div>
      <div class="kpi"><span class="kv">${list.filter(c => c.last_viewed_at && (Date.now() - new Date(c.last_viewed_at)) < 7 * 864e5).length}</span><span class="kl">Viewed this week</span></div></div></div>
    <div id="flash">${flash || ""}</div>
    <section class="card"><div class="card-hd"><h2 class="card-t">Add a client login</h2><span class="card-s">They choose their own password on first sign-in</span></div>
      <form id="af" novalidate><div class="grid">
        <div><label class="f" for="a_name">Name</label><input class="inp" id="a_name" autocomplete="off"></div>
        <div><label class="f" for="a_co">Company</label><input class="inp" id="a_co" autocomplete="off"></div>
        <div><label class="f" for="a_em">Email</label><input class="inp" id="a_em" type="email" autocomplete="off" required></div>
        <div><label class="f" for="a_pw">Temporary password</label><div class="pw"><input class="inp" id="a_pw" autocomplete="off" required><button class="btn sm sec" type="button" id="gen">New</button></div></div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;padding:0 16px 16px;flex-wrap:wrap">
        <label class="chk"><input type="checkbox" id="a_adm"> Admin (can manage clients)</label>
        <button class="btn" type="submit">Create login</button><span class="msg err" id="amsg" hidden></span></div></form>
    </section>
    <section class="card"><div class="card-hd"><h2 class="card-t">Logins <span class="cnt">${list.length}</span></h2><span class="card-s">Times are UK time</span></div>
      ${table(`<th>Name / email</th><th>Company</th><th>Status</th><th>Last sign-in</th><th>Last viewed</th><th class="r">Views (30 days)</th><th>Actions</th>`, rows)}
    </section>`, "Only admins can see this page");

  const f = document.getElementById("af"), pw = document.getElementById("a_pw"), am = document.getElementById("amsg");
  pw.value = genPassword();
  document.getElementById("gen").onclick = () => { pw.value = genPassword(); };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy, b));
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); am.hidden = true;
    const email = f.a_em.value.trim().toLowerCase(), password = pw.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { am.textContent = "Enter a valid email address."; am.hidden = false; return; }
    if (password.length < 10) { am.textContent = "The temporary password needs at least 10 characters."; am.hidden = false; return; }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Creating…";
    try {
      await adminCall({ action: "create", email, password, name: f.a_name.value, company: f.a_co.value, is_admin: f.a_adm.checked });
      await pageClients(credsBox(email, password, true));
    } catch (e) { am.textContent = friendlyError(e); am.hidden = false; btn.disabled = false; btn.textContent = "Create login"; }
  });
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
    const tr = b.closest("tr"), email = tr.dataset.email, c = list.find(x => x.email === email), act = b.dataset.act;
    if ((act === "remove" || act === "reset" || act === "suspend") && !b.classList.contains("arm")) {
      const o = b.textContent; b.classList.add("arm"); b.textContent = act === "remove" ? "Confirm remove" : act === "reset" ? "Confirm reset" : "Confirm suspend";
      setTimeout(() => { b.classList.remove("arm"); b.textContent = o; }, 4000); return;
    }
    b.disabled = true;
    try {
      if (act === "reset") { const p = genPassword(); await adminCall({ action: "set_password", email, password: p }); return pageClients(credsBox(email, p, false)); }
      if (act === "remove") await adminCall({ action: "remove", email });
      else {
        const { error } = await sb.rpc("admin_update_client", { p_email: email, p_name: c.name, p_company: c.company,
          p_active: act === "activate" ? true : act === "suspend" ? false : c.active,
          p_is_admin: act === "admin" ? true : act === "unadmin" ? false : c.is_admin });
        if (error) throw error;
      }
      await pageClients(`<p class="note ok"><b>Done.</b> ${esc(email)} updated.</p>`);
    } catch (e) { document.getElementById("flash").innerHTML = `<p class="note err"><b>Couldn’t do that.</b> ${esc(friendlyError(e))}</p>`; b.disabled = false; }
  }));
}

// ---- routing ---------------------------------------------------------------------
async function route() {
  if (!S.session) return showLogin();
  if (!S.me || !S.me.active) return showNoAccess();
  if (S.me.must_change_password) return showSetPassword(true);
  const h = location.hash.replace(/^#\/?/, "");
  try {
    if (h === "archive") await pageArchive();
    else if (h === "clients") await pageClients();
    else if (h === "password") showSetPassword(false);
    else if (h.startsWith("day/")) await pageDay(h.slice(4));
    else await pageDay(null);
    window.scrollTo(0, 0);
  } catch (e) {
    if (/JWT|session|401/i.test(String(e && e.message))) { await signOut(); return; }
    shell("day", `<p class="note err"><b>Something went wrong loading this page.</b> ${esc(friendlyError(e))} <a href="#/" onclick="location.reload()">Try again</a></p>`);
  }
}
async function boot() {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (!S.session) return showLogin();
  const email = (S.session.user.email || "").toLowerCase();
  const { data: me, error } = await sb.from("clients").select("*").eq("email", email).maybeSingle();
  if (error) { showLogin(friendlyError(error)); return; }
  S.me = me;
  await route();
}
window.addEventListener("hashchange", () => { if (S.session) route(); });
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "SIGNED_OUT") { S.session = null; S.me = null; showLogin(); }
  else if (session) S.session = session;
});
boot();
</script>
